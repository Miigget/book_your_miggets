name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Optional: database password. If unset, CLI uses a temporary login role via the access token.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes

      - name: Push Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --linked --yes

      - name: Detect KoG maps seed change
        id: seed
        run: |
          set -euo pipefail
          SEED_PATH="supabase/seed-data/kog-maps.sql"
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            echo "No previous tag — will seed maps."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$PREV" HEAD | grep -Fxq "$SEED_PATH"; then
            echo "Seed file changed since $PREV — will seed maps."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Seed file unchanged since $PREV — skip maps seed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Seed KoG maps (when seed file changed)
        if: steps.seed.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db query --linked -f supabase/seed-data/kog-maps.sql

      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
